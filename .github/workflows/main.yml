name: '🔏 Yarn Lock Changes'
on: [pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: '🚚 Checkout'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: '🔏 Yarn Lock Changes'
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}